[package]
name = "hushcore-engine"
version = "0.0.99"
edition = "2021"
description = "Native low-latency audio engine for HushCore (WASAPI, Core Audio, PulseAudio/PipeWire)"
license = "MIT"

[lib]
name = "hushcore_engine"
path = "src/lib.rs"

[[bin]]
name = "hushcore-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
realfft = "3"
rtrb = "0.3"
arc-swap = "1"
anyhow = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Security",
]

# Linux: the PulseAudio client API, served natively by PipeWire (pipewire-pulse) and by PulseAudio.
[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"

# macOS: Core Audio through cpal (no bindgen; the Core Audio bindings are generated ahead of time).
[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
