[package]
name = "hushcore-engine"
version = "0.0.2"
edition = "2021"
description = "Native low-latency audio engine for HushCore"
license = "MIT"

[lib]
name = "hushcore_engine"
path = "src/lib.rs"

[[bin]]
name = "hushcore-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
realfft = "3"
rtrb = "0.3"
arc-swap = "1"
anyhow = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Security",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
