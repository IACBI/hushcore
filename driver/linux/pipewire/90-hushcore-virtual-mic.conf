# HushCore virtual microphone for PipeWire.
#
# Installed by scripts/linux/install-virtual-mic.sh to
#   ${XDG_CONFIG_HOME:-~/.config}/pipewire/pipewire.conf.d/90-hushcore-virtual-mic.conf
# and removed by uninstall-virtual-mic.sh. PipeWire reads it at start, so the user audio
# services must be restarted after installing.
#
# A loopback module with a sink on its capture side and a source on its playback side:
#   hushcore_sink  (HushCore Sink)       what the engine writes to
#   hushcore_mic   (HushCore Microphone) what Discord, OBS or Zoom read from
# Nothing is routed to the speakers; the sink only exists to be written to.

context.modules = [
    {
        name = libpipewire-module-loopback
        args = {
            node.description = "HushCore Microphone"
            capture.props = {
                node.name = "hushcore_sink"
                node.description = "HushCore Sink"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "hushcore_mic"
                node.description = "HushCore Microphone"
                media.class = "Audio/Source"
                audio.position = [ FL FR ]
            }
        }
    }
]
