name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # sounddevice fails to import without the PortAudio shared library
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      # Only what the tests import. pedalboard and pystray are not needed without audio hardware or a desktop.
      - name: Install test dependencies
        run: python -m pip install fastapi uvicorn numpy scipy sounddevice httpx pytest

      - name: Run tests
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
